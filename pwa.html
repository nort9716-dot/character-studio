<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08090d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Character Studio"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg"><title>Character Studio</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08090d}iframe{display:block;width:100%;height:100%;border:0}</style></head><body><iframe id="appFrame" src="./director.html" title="Character Studio — Autonomous AI Director"></iframe><script>
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{})}
const frame=document.getElementById('appFrame');
function installTabrizi(){const d=frame.contentDocument;if(!d||!d.body)return;const sel=d.getElementById('dDialogueLang');if(!sel)return;if(![...sel.options].some(o=>o.value==='ترکی تبریزی')){const o=d.createElement('option');o.value='ترکی تبریزی';o.textContent='ترکی تبریزی';sel.appendChild(o)}let box=d.getElementById('tabriziOptions');if(!box){box=d.createElement('div');box.id='tabriziOptions';box.style.cssText='display:none;border:1px solid #353a46;background:#0b0d12;border-radius:10px;padding:11px;margin-top:8px';box.innerHTML='<div style="font-size:12px;color:#cdd1d9;margin-bottom:8px">گزینه‌های همین دیالوگ</div><label style="display:flex;gap:8px;align-items:center;font-size:12px;color:#cdd1d9;margin:7px 0"><input id="tabLatin" type="checkbox"> خروجی لاتینِ تلفظی هم می‌خواهم</label><label style="display:flex;gap:8px;align-items:center;font-size:12px;color:#cdd1d9;margin:7px 0"><input id="tabEnglish" type="checkbox"> ترجمه انگلیسی هم می‌خواهم</label><div style="font-size:11px;color:#8f96a3;margin-top:8px">خروجی اصلی: ترکی تبریزی با خط فارسی + اعراب‌گذاری تلفظی. لاتین یعنی همان تلفظ، نه ترجمه.</div>';const field=sel.closest('.field');if(field)field.after(box)}const sync=()=>{box.style.display=sel.value==='ترکی تبریزی'?'block':'none'};sel.addEventListener('change',sync);sync();const apply=()=>{if(sel.value!=='ترکی تبریزی')return;const el=d.getElementById('dDialogue');if(!el)return;const marker='\n\n[TRABIZI_DIALOGUE_OPTIONS]';const clean=el.value.replace(/\n\n\[TRABIZI_DIALOGUE_OPTIONS\][\\s\\S]*$/,'');const latin=d.getElementById('tabLatin')?.checked?'YES':'NO';const english=d.getElementById('tabEnglish')?.checked?'YES':'NO';el.value=clean+marker+'\nPrimary output: Tabrizi Azerbaijani in Persian script with pronunciation diacritics.\nLatin phonetic output: '+latin+' — transliterate the same spoken wording, DO NOT translate.\nEnglish translation: '+english+' — provide a separate semantic translation only if YES.\nPreserve colloquial Tabrizi pronunciation and do not substitute Istanbul Turkish.'};['tabLatin','tabEnglish'].forEach(id=>d.getElementById(id)?.addEventListener('change',apply));const btn=d.getElementById('createAll');if(btn&&!btn.dataset.tabHook){btn.dataset.tabHook='1';btn.addEventListener('click',apply,true)}}
frame.addEventListener('load',()=>{setTimeout(installTabrizi,100);setTimeout(installTabrizi,700)});
</script></body></html>
