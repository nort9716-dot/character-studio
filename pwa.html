<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08090d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Character Studio"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg"><title>Character Studio</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08090d}iframe{display:block;width:100%;height:100%;border:0}</style></head><body><iframe id="appFrame" src="./director.html?v=studio3" title="Character Studio — Autonomous AI Director"></iframe><script>
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{})}
const frame=document.getElementById('appFrame');
function enhance(){try{const d=frame.contentDocument;if(!d||!d.body)return false;const main=d.querySelector('main');const nav=d.querySelector('aside');const sel=d.getElementById('dDialogueLang');const dia=d.getElementById('dDialogue');if(!main||!nav||!sel||!dia)return false;
if(![...sel.options].some(o=>o.value==='ترکی تبریزی')){const o=d.createElement('option');o.value='ترکی تبریزی';o.textContent='ترکی تبریزی';sel.appendChild(o)}
if(!d.getElementById('csTabriziOptions')){const box=d.createElement('div');box.id='csTabriziOptions';box.style.cssText='display:none;border:1px solid #353a46;background:#0b0d12;border-radius:10px;padding:11px;margin-top:8px';box.innerHTML='<div style="font-size:12px;color:#cdd1d9;margin-bottom:8px">اختیارات همین دیالوگ</div><label style="display:flex;gap:8px;align-items:center;font-size:12px;color:#cdd1d9;margin:7px 0"><input id="tabLatin" type="checkbox"> خروجی لاتینِ تلفظی هم می‌خواهم</label><label style="display:flex;gap:8px;align-items:center;font-size:12px;color:#cdd1d9;margin:7px 0"><input id="tabEnglish" type="checkbox"> ترجمه انگلیسی هم می‌خواهم</label>';const field=dia.closest('.field');if(field)field.appendChild(box);else dia.parentElement?.appendChild(box);const sync=()=>box.style.display=(sel.value==='ترکی تبریزی'||sel.value==='آذربایجانی')?'block':'none';sel.addEventListener('change',sync);sync()}
if(!d.getElementById('csWorkspace')){const css=d.createElement('style');css.id='csWorkspaceStyle';css.textContent='.csws{border:1px solid #292d38;background:#10131a;border-radius:16px;padding:14px;margin-bottom:15px}.csws h3{margin:0 0 5px}.csws p{margin:0 0 12px;color:#9ba1ad;font-size:12px;line-height:1.7}.cswsgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:9px}.cswsbtn{border:1px solid #353a46;background:#0b0d12;color:#fff;border-radius:11px;padding:12px;text-align:right;cursor:pointer}.cswsbtn b{display:block;margin-bottom:4px}.cswsbtn span{font-size:11px;color:#9ba1ad}.cswsbtn.active{border-color:#fff;background:#1a1d25}.csts{border:1px solid #353a46;background:#0b0d12;border-radius:12px;padding:13px;margin-top:12px;display:none}.csts textarea,.csts select{width:100%;box-sizing:border-box;background:#080a0e;color:#fff;border:1px solid #353a46;border-radius:9px;padding:10px;margin-top:7px}.csts button{border:1px solid #fff;background:#fff;color:#111;border-radius:9px;padding:9px 13px;font-weight:800;margin-top:9px}.cstsout{white-space:pre-wrap;line-height:1.8;margin-top:10px;display:none;border:1px solid #292d38;border-radius:9px;padding:11px}.cstschips{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.cstschips button{margin:0;border:1px solid #353a46;background:#171a21;color:#fff;font-weight:400}';d.head.appendChild(css);const ws=d.createElement('div');ws.id='csWorkspace';ws.className='csws';ws.innerHTML='<h3>روش کار</h3><p>دو مسیر روشن: اگر فقط ایده داری، ساخت خودکار را انتخاب کن. اگر کنترل کامل می‌خواهی، Manual Workflow را استفاده کن. اگر تولید یا بخشی از Prompt مشکل خورد، Smart Troubleshooter را باز کن.</p><div class="cswsgrid"><button class="cswsbtn active" data-csgo="director"><b>🚀 ساخت خودکار</b><span>ایده → Story → Storyboard → Shots → Prompts → Package</span></button><button class="cswsbtn" data-csgo="manual"><b>⚙ کار حرفه‌ای دستی</b><span>کنترل مرحله‌به‌مرحله و دقیق</span></button><button class="cswsbtn" data-csgo="repair"><b>🛠 Prompt Repair</b><span>اصلاح Prompt و سازگارکردن با Generator</span></button><button class="cswsbtn" id="csTroubleBtn"><b>🧠 Smart Troubleshooter</b><span>عیب‌یابی تعاملی با سؤال‌های هوشمند</span></button></div><div id="csTrouble" class="csts"><b>🧠 عیب‌یاب هوشمند تولید</b><p style="margin-top:5px">مشکل را توضیح بده یا خطای Generator را وارد کن. سیستم سؤال‌های ضروری را مرحله‌به‌مرحله می‌پرسد و در پایان علت محتمل، راه‌حل و در صورت امکان Prompt اصلاح‌شده می‌دهد.</p><label style="font-size:12px;color:#cdd1d9">مدل / ابزار<select id="csTModel"><option>Seedance 2.5</option><option>Higgsfield</option><option>Kling</option><option>Veo</option><option>Sora</option><option>GPT Image</option><option>Other</option></select></label><label style="display:block;font-size:12px;color:#cdd1d9;margin-top:9px">Prompt یا توضیح کار<textarea id="csTPrompt" rows="6" placeholder="Prompt، ایده یا بخشی که مشکل خورده..."></textarea></label><label style="display:block;font-size:12px;color:#cdd1d9;margin-top:9px">خطا / نتیجه‌ای که گرفتی<textarea id="csTError" rows="4" placeholder="مثلاً: تصویر ساخته نشد، چهره عوض شد، پاها خراب شد، بخشی از ویدیو قطع شد، Prompt Reject شد..."></textarea></label><button id="csTStart">شروع عیب‌یابی</button><div id="csTOut" class="cstsout"></div><div id="csTChoices" class="cstschips"></div></div>';main.insertBefore(ws,main.firstChild);
ws.querySelectorAll('[data-csgo]').forEach(b=>b.onclick=()=>{const p=b.dataset.csgo;d.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));d.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.page===p));d.getElementById(p)?.classList.add('active');scrollTo(0,0)});const trouble=d.getElementById('csTrouble');d.getElementById('csTroubleBtn').onclick=()=>trouble.style.display=trouble.style.display==='block'?'none':'block';let diagState={prompt:'',error:'',history:[]};const api=()=>localStorage.getItem('cs_api')||'https://character-studio-nort9716.netlify.app/api/generate';async function ask(extra){const out=d.getElementById('csTOut'),choices=d.getElementById('csTChoices');const model=d.getElementById('csTModel').value;const payload='MODEL: '+model+'\nPROMPT: '+diagState.prompt+'\nERROR/RESULT: '+diagState.error+'\nCONVERSATION: '+JSON.stringify(diagState.history)+'\n'+(extra||'');out.style.display='block';out.textContent='در حال تحلیل...';choices.innerHTML='';try{const r=await fetch(api(),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:'diagnostic',prompt:payload})});const x=await r.json();if(!r.ok)throw new Error(x.error||'Diagnostic failed');const z=x.diagnostic||{};out.textContent='تشخیص: '+(z.diagnosis||'')+'\n\nاطمینان: '+(z.confidence||'')+'\n\nعلت‌های محتمل:\n'+(z.likely_causes||[]).map(v=>'• '+v).join('\n')+'\n\nاقدام پیشنهادی:\n'+(z.immediate_fix||'')+(z.repaired_prompt?'\n\nPROMPT اصلاح‌شده:\n'+z.repaired_prompt:'');if(z.ask_more&&z.next_question){out.textContent+='\n\nسؤال بعدی:\n'+z.next_question;(z.question_options||[]).forEach(v=>{const b=d.createElement('button');b.textContent=v;b.onclick=()=>{diagState.history.push({question:z.next_question,answer:v});ask('ANSWER: '+v)};choices.appendChild(b)})}else choices.innerHTML='<span style="font-size:12px;color:#bfe5c8">عیب‌یابی کامل شد.</span>'}catch(e){out.textContent='خطا: '+e.message}}d.getElementById('csTStart').onclick=()=>{diagState={prompt:d.getElementById('csTPrompt').value.trim(),error:d.getElementById('csTError').value.trim(),history:[]};ask('شروع عیب‌یابی؛ علت را دسته‌بندی کن و فقط یک سؤال ضروری بپرس.')}}
return true}catch(e){return false}}
frame.addEventListener('load',()=>{let n=0;const t=setInterval(()=>{n++;if(enhance()||n>40)clearInterval(t)},200)});setTimeout(enhance,100);setTimeout(enhance,1000);setTimeout(enhance,2500);setTimeout(enhance,5000);
</script></body></html>
