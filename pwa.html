<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08090d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Character Studio"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg"><title>Character Studio</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08090d}iframe{display:block;width:100%;height:100%;border:0}</style></head><body><iframe id="appFrame" src="./director.html?v=tabrizi3" title="Character Studio — Autonomous AI Director"></iframe><script>
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{})}
const frame=document.getElementById('appFrame');
function installTabrizi(){
  try{
    const d=frame.contentDocument;
    if(!d||!d.body)return false;
    const sel=d.getElementById('dDialogueLang');
    const dia=d.getElementById('dDialogue');
    if(!sel||!dia)return false;
    if(![...sel.options].some(o=>o.value==='ترکی تبریزی')){
      const o=d.createElement('option');o.value='ترکی تبریزی';o.textContent='ترکی تبریزی';sel.appendChild(o)
    }
    let box=d.getElementById('tabriziOptions');
    if(!box){
      box=d.createElement('div');box.id='tabriziOptions';
      box.style.cssText='display:none;border:1px solid #353a46;background:#0b0d12;border-radius:10px;padding:11px;margin-top:8px';
      box.innerHTML='<div style="font-size:12px;color:#cdd1d9;margin-bottom:8px">اختیارات همین دیالوگ</div><label style="display:flex;gap:8px;align-items:center;font-size:12px;color:#cdd1d9;margin:7px 0"><input id="tabLatin" type="checkbox"> خروجی لاتینِ تلفظی هم می‌خواهم</label><label style="display:flex;gap:8px;align-items:center;font-size:12px;color:#cdd1d9;margin:7px 0"><input id="tabEnglish" type="checkbox"> ترجمه انگلیسی هم می‌خواهم</label><div style="font-size:11px;color:#8f96a3;margin-top:8px">این گزینه‌ها فقط برای همین دیالوگ هستند؛ خروجی اصلی ترکی تبریزی با خط فارسی و اعراب‌گذاری تلفظی است.</div>';
      const field=dia.closest('.field');
      if(field)field.appendChild(box); else dia.parentElement?.appendChild(box);
    }
    const sync=()=>{const active=sel.value==='ترکی تبریزی'||sel.value==='آذربایجانی';box.style.display=active?'block':'none'};
    if(!sel.dataset.tabriziHook){
      sel.dataset.tabriziHook='1';sel.addEventListener('change',sync);
      ['tabLatin','tabEnglish'].forEach(id=>d.getElementById(id)?.addEventListener('change',()=>{}));
    }
    sync();
    return true;
  }catch(e){return false}
}
frame.addEventListener('load',()=>{let n=0;const t=setInterval(()=>{n++;if(installTabrizi()||n>30)clearInterval(t)},200)});
setTimeout(installTabrizi,100);setTimeout(installTabrizi,1000);setTimeout(installTabrizi,2500);
</script></body></html>
