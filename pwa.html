<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08090d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Character Studio"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg"><title>Character Studio</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08090d}iframe{display:block;width:100%;height:100%;border:0}</style></head><body><iframe id="appFrame" src="./index.html?v=unified1" title="Character Studio — Unified Creative Studio"></iframe><script>
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{})}
const frame=document.getElementById('appFrame');
function enhance(){try{const d=frame.contentDocument;if(!d||!d.body)return false;const main=d.querySelector('main');if(!main)return false;
if(!d.getElementById('csUnifiedWorkspace')){const css=d.createElement('style');css.id='csUnifiedCSS';css.textContent='.csuw{border:1px solid #292d38;background:#10131a;border-radius:16px;padding:14px;margin-bottom:15px}.csuw h3{margin:0 0 5px}.csuw p{margin:0 0 12px;color:#9ba1ad;font-size:12px;line-height:1.7}.csugrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:9px}.csuBtn{border:1px solid #353a46;background:#0b0d12;color:#fff;border-radius:11px;padding:12px;text-align:right;cursor:pointer}.csuBtn b{display:block;margin-bottom:4px}.csuBtn span{font-size:11px;color:#9ba1ad}.csuBtn.primary{background:#fff;color:#111;border-color:#fff}.csDiag{display:none;border:1px solid #353a46;background:#0b0d12;border-radius:12px;padding:13px;margin-top:12px}.csDiag textarea,.csDiag select{width:100%;box-sizing:border-box;background:#080a0e;color:#fff;border:1px solid #353a46;border-radius:9px;padding:10px;margin-top:7px}.csDiag button{border:1px solid #fff;background:#fff;color:#111;border-radius:9px;padding:9px 13px;font-weight:800;margin-top:9px}.csDiagOut{white-space:pre-wrap;line-height:1.8;margin-top:10px;display:none;border:1px solid #292d38;border-radius:9px;padding:11px}.csChoices{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.csChoices button{margin:0;border:1px solid #353a46;background:#171a21;color:#fff;font-weight:400}';d.head.appendChild(css);
const ws=d.createElement('div');ws.id='csUnifiedWorkspace';ws.className='csuw';ws.innerHTML='<h3>Character Studio — Workspace</h3><p>همه ابزارها در یک محیط واحد. برای تحویل سریع فقط ایده بده؛ برای کنترل حرفه‌ای وارد Manual شو؛ برای خطا از Repair یا عیب‌یاب هوشمند استفاده کن.</p><div class="csugrid"><button class="csuBtn primary" id="csAuto"><b>🚀 ایده → خروجی کامل</b><span>Autonomous Creative Director</span></button><button class="csuBtn" id="csManual"><b>⚙ Manual / Professional</b><span>کنترل مرحله‌به‌مرحله با Libraryها</span></button><button class="csuBtn" id="csRepair"><b>🛠 Prompt Repair</b><span>اصلاح Prompt بدون تغییر نیت</span></button><button class="csuBtn" id="csTrouble"><b>🧠 Smart Troubleshooter</b><span>عیب‌یابی تعاملی و سؤال‌محور</span></button></div><div id="csDiag" class="csDiag"><b>🧠 Smart Troubleshooter</b><div style="font-size:12px;color:#9ba1ad;margin-top:5px">مشکل را توضیح بده. سیستم فقط سؤال‌های ضروری را یکی‌یکی می‌پرسد و در پایان تشخیص، راه‌حل و Prompt اصلاح‌شده می‌دهد.</div><label style="display:block;font-size:12px;color:#cdd1d9;margin-top:9px">Generator / Model<select id="csDModel"><option>Seedance 2.5</option><option>Higgsfield</option><option>Kling</option><option>Veo</option><option>Sora</option><option>GPT Image</option><option>Other</option></select></label><label style="display:block;font-size:12px;color:#cdd1d9;margin-top:9px">Prompt / ایده<textarea id="csDPrompt" rows="5" placeholder="Prompt یا ایده‌ای که مشکل دارد..."></textarea></label><label style="display:block;font-size:12px;color:#cdd1d9;margin-top:9px">نتیجه / خطا<textarea id="csDError" rows="4" placeholder="چه اتفاقی افتاد؟ مثلاً چهره عوض شد، تصویر ساخته نشد، بخشی از ویدیو خراب شد..."></textarea></label><button id="csDStart">شروع عیب‌یابی</button><div id="csDOut" class="csDiagOut"></div><div id="csDChoices" class="csChoices"></div></div>';main.insertBefore(ws,main.firstChild);
const nav=(page)=>{d.querySelector(`[data-page="${page}"]`)?.click()};d.getElementById('csAuto').onclick=()=>nav('production');d.getElementById('csManual').onclick=()=>nav('create');d.getElementById('csRepair').onclick=()=>{nav('create');setTimeout(()=>d.getElementById('idea')?.focus(),50)};d.getElementById('csTrouble').onclick=()=>{const x=d.getElementById('csDiag');x.style.display=x.style.display==='block'?'none':'block'};
let state={prompt:'',error:'',history:[]};const api=()=>localStorage.getItem('cs_api')||localStorage.getItem('CS_DB')&&JSON.parse(localStorage.getItem('CS_DB')).settings?.apiUrl||'https://character-studio-nort9716.netlify.app/api/generate';async function diagnose(extra=''){const out=d.getElementById('csDOut'),choices=d.getElementById('csDChoices');out.style.display='block';out.textContent='در حال تحلیل هوشمند...';choices.innerHTML='';const payload=`MODEL: ${d.getElementById('csDModel').value}\nPROMPT: ${state.prompt}\nERROR/RESULT: ${state.error}\nCONVERSATION: ${JSON.stringify(state.history)}\n${extra}`;try{const r=await fetch(api(),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:'diagnostic',prompt:payload})});const x=await r.json();if(!r.ok)throw Error(x.error||'Diagnostic failed');const z=x.diagnostic||{};out.textContent=`تشخیص: ${z.diagnosis||''}\n\nاطمینان: ${z.confidence||''}\n\nعلت‌های محتمل:\n${(z.likely_causes||[]).map(v=>'• '+v).join('\n')}\n\nاقدام پیشنهادی:\n${z.immediate_fix||''}${z.repaired_prompt?'\n\nPROMPT اصلاح‌شده:\n'+z.repaired_prompt:''}`;if(z.ask_more&&z.next_question){out.textContent+=`\n\nسؤال بعدی:\n${z.next_question}`;(z.question_options||[]).forEach(v=>{const b=d.createElement('button');b.textContent=v;b.onclick=()=>{state.history.push({question:z.next_question,answer:v});diagnose('ANSWER: '+v)};choices.appendChild(b)})}else choices.innerHTML='<span style="font-size:12px;color:#bfe5c8">عیب‌یابی کامل شد.</span>'}catch(e){out.textContent='خطا: '+e.message}};d.getElementById('csDStart').onclick=()=>{state={prompt:d.getElementById('csDPrompt').value.trim(),error:d.getElementById('csDError').value.trim(),history:[]};diagnose('START: Ask only one essential question if required.')};return true}catch(e){return false}}
frame.addEventListener('load',()=>{let n=0;const t=setInterval(()=>{n++;if(enhance()||n>40)clearInterval(t)},200)});setTimeout(enhance,100);setTimeout(enhance,1000);setTimeout(enhance,2500);setTimeout(enhance,5000);
</script></body></html>
