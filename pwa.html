<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08090d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Character Studio"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg"><title>Character Studio</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08090d}iframe{display:block;width:100%;height:100%;border:0}</style></head><body><iframe id="appFrame" src="./index.html?v=unified2" title="Character Studio — Unified Creative Studio"></iframe><script>
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{})}
const frame=document.getElementById('appFrame');
const api=()=>localStorage.getItem('cs_api')||(()=>{try{return JSON.parse(localStorage.getItem('CS_DB')||'{}').settings?.apiUrl||'/api/generate'}catch{return '/api/generate'}})();
function install(){try{const d=frame.contentDocument;if(!d||!d.body)return false;const main=d.querySelector('main');if(!main)return false;
if(!d.getElementById('csUnifiedWorkspace')){const css=d.createElement('style');css.id='csUnifiedCSS';css.textContent='.csuw{border:1px solid #292d38;background:#10131a;border-radius:16px;padding:14px;margin-bottom:15px}.csuw h3{margin:0 0 5px}.csuw p{margin:0 0 12px;color:#9ba1ad;font-size:12px;line-height:1.7}.csugrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:9px}.csuBtn{border:1px solid #353a46;background:#0b0d12;color:#fff;border-radius:11px;padding:12px;text-align:right;cursor:pointer}.csuBtn b{display:block;margin-bottom:4px}.csuBtn span{font-size:11px;color:#9ba1ad}.csuBtn.primary{background:#fff;color:#111;border-color:#fff}.csDiag{display:none;border:1px solid #353a46;background:#0b0d12;border-radius:12px;padding:13px;margin-top:12px}.csDiag textarea,.csDiag select{width:100%;box-sizing:border-box;background:#080a0e;color:#fff;border:1px solid #353a46;border-radius:9px;padding:10px;margin-top:7px}.csDiag button{border:1px solid #fff;background:#fff;color:#111;border-radius:9px;padding:9px 13px;font-weight:800;margin-top:9px}.csDiagOut{white-space:pre-wrap;line-height:1.8;margin-top:10px;display:none;border:1px solid #292d38;border-radius:9px;padding:11px}';d.head.appendChild(css);
const ws=d.createElement('div');ws.id='csUnifiedWorkspace';ws.className='csuw';ws.innerHTML='<h3>Character Studio — Workspace</h3><p>ایده خام را بده؛ سیستم پروژه را می‌سازد و دیالوگ‌های داخل داستان را جدا می‌کند.</p><div class="csugrid"><button class="csuBtn primary" id="csAuto"><b>🚀 ایده → خروجی کامل</b><span>Autonomous Creative Director</span></button><button class="csuBtn" id="csManual"><b>⚙ Manual / Professional</b><span>کنترل مرحله‌به‌مرحله</span></button><button class="csuBtn" id="csRepair"><b>🛠 Prompt Repair</b><span>اصلاح Prompt بدون تغییر نیت</span></button><button class="csuBtn" id="csTrouble"><b>🧠 Smart Troubleshooter</b><span>عیب‌یابی هوشمند</span></button></div><div id="csDiag" class="csDiag"><b>🧠 Smart Troubleshooter</b><textarea id="csDPrompt" rows="5" placeholder="Prompt یا ایده‌ای که مشکل دارد..."></textarea><textarea id="csDError" rows="4" placeholder="خطا یا نتیجه نامطلوب..."></textarea><button id="csDStart">شروع عیب‌یابی</button><div id="csDOut" class="csDiagOut"></div></div>';main.insertBefore(ws,main.firstChild);
const nav=p=>d.querySelector(`[data-page="${p}"]`)?.click();d.getElementById('csAuto').onclick=()=>nav('production');d.getElementById('csManual').onclick=()=>{window.location.href='./director.html#manual'};d.getElementById('csRepair').onclick=()=>{nav('create');setTimeout(()=>d.getElementById('idea')?.focus(),50)};d.getElementById('csTrouble').onclick=()=>{d.getElementById('csDiag').style.display=d.getElementById('csDiag').style.display==='block'?'none':'block'};
async function autoProduction(){const idea=d.getElementById('projectIdea');const out=d.getElementById('productionOutput');const status=d.getElementById('productionStatus');if(!idea?.value.trim()){if(status){status.textContent='ایده پروژه را وارد کن.';status.style.display='block'}return}const lang=d.getElementById('prodLang')?.value||'English';const tone=d.getElementById('tone')?.value||'cinematic';const style=d.getElementById('prodStyle')?.value||'Photorealistic Cinematic';const btn=d.getElementById('runProduction');if(btn)btn.disabled=true;if(status){status.textContent='در حال ساخت پروژه و استخراج دیالوگ‌ها...';status.style.display='block'}try{const instruction=`Create the complete production package from the story below. IMPORTANT: scan the entire story and extract EVERY dialogue line that is actually present, including dialogue embedded inside quotation marks or mixed with narration. Do not invent dialogue. For every extracted line return speaker, original_line, translated_line, original_language, language. Translate the extracted dialogue into the selected Dialogue Language: ${lang}. If selected language is "بدون دیالوگ", do not translate; still extract only dialogue that actually exists. Keep dialogue separate from narration and synchronize it to the relevant scene/shot. Return JSON with keys project, story, storyboard, shots, dialogue, element_mapping, continuity, seedance_prompt. Prompt language: ${lang}. Visual style: ${style}. Tone: ${tone}. STORY/REQUEST:\n${idea.value.trim()}`;const r=await fetch(api(),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:'director',prompt:instruction,tone,style,promptLanguage:lang,dialogueLanguage:lang})});const x=await r.json();if(!r.ok)throw Error(x.error||'Backend error');const z=x.result||x;let text='PROJECT\n'+(z.project||'')+'\n\nSTORY\n'+(z.story||'')+'\n\nSTORYBOARD\n'+(z.storyboard||'')+'\n\nDIALOGUE — EXTRACTED & TRANSLATED\n';if(Array.isArray(z.dialogue)&&z.dialogue.length){text+=z.dialogue.map((q,i)=>`${i+1}. ${q.speaker||'Speaker'}\nOriginal: ${q.original_line||q.line||''}\nTranslated (${q.language||lang}): ${q.translated_line||q.line||''}`).join('\n\n')}else text+='No dialogue found.';text+='\n\nSEEDANCE 2.5 PROMPT\n'+(z.seedance_prompt||'');if(out){out.style.display='block';out.textContent=text}if(status){status.textContent='پروژه کامل ساخته شد؛ دیالوگ‌ها جدا و ترجمه شدند.';status.style.display='block'}}catch(e){if(status){status.textContent='خطا: '+e.message;status.style.display='block'}}finally{if(btn)btn.disabled=false}}
const rp=d.getElementById('runProduction');if(rp)rp.onclick=autoProduction;
return true}catch(e){return false}}
function boot(){let n=0;const t=setInterval(()=>{n++;if(install()||n>40)clearInterval(t)},200)}frame.addEventListener('load',boot);boot();
</script></body></html>
