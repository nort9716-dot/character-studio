<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Character Studio</title><style>body{margin:0;background:#08090d;color:#f7f8fb;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}*{box-sizing:border-box}button,input,textarea,select{font:inherit}button{cursor:pointer}.top{padding:18px 24px;border-bottom:1px solid #292d38;background:#090a0e}.app{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 70px)}aside{padding:12px;background:#0b0d12;border-left:1px solid #292d38}.nav{display:block;width:100%;padding:12px;margin:3px 0;border:0;border-radius:10px;background:transparent;color:#aab0bc;text-align:right}.nav.active,.nav:hover{background:#1a1d25;color:#fff}main{max-width:1250px;width:100%;margin:auto;padding:24px}.page{display:none}.page.active{display:block}.panel{background:#12141b;border:1px solid #292d38;border-radius:18px;padding:20px;margin-bottom:15px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}.row{display:flex;gap:10px;flex-wrap:wrap}.field{margin:12px 0}.field label{display:block;margin-bottom:6px}.input,.textarea,.select{width:100%;background:#0b0d12;color:#fff;border:1px solid #353a46;border-radius:10px;padding:11px}.textarea{min-height:150px}.btn{background:#20232c;color:#fff;border:1px solid #383d49;border-radius:10px;padding:10px 14px}.primary{background:#fff;color:#111;font-weight:800}.success{background:#173522}.mode{background:#0e1016;color:#fff;border:1px solid #292d38;border-radius:12px;padding:18px;text-align:right}.mode:hover,.mode.active{background:#171a22;border-color:#687181}.mode b{display:block;margin-bottom:5px}.status{display:none;margin-top:12px;padding:11px;border-radius:10px;background:#173522;border:1px solid #31503b;color:#bfe5c8}.warn{background:#19160a;border-color:#66572e;color:#e8d58e}.out{white-space:pre-wrap;background:#0a0c10;border:1px solid #292d38;border-radius:11px;padding:15px;line-height:1.8;direction:ltr;text-align:left;max-height:800px;overflow:auto;margin-top:12px}.elementList{display:grid;gap:8px}.element{display:grid;grid-template-columns:60px 1fr 140px 34px;gap:8px;align-items:center;border:1px solid #292d38;padding:8px;border-radius:10px}.element img{width:52px;height:52px;object-fit:cover;border-radius:8px}.preview{max-width:220px;max-height:220px;display:block;margin-top:10px;border-radius:10px}.step{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.step span{padding:7px 9px;border:1px solid #292d38;border-radius:99px;font-size:11px}.done{background:#102017!important;border-color:#31503b!important;color:#bfe5c8}.badge{border:1px solid #414753;border-radius:99px;padding:6px 10px;font-size:10px;color:#c8cdd6}@media(max-width:850px){.app{display:block}aside{position:fixed;bottom:0;left:0;right:0;height:68px;z-index:10;display:grid;grid-template-columns:repeat(5,1fr);padding:4px}.nav{text-align:center;font-size:9px}main{padding:12px 10px 85px}}
</style></head><body><header class="top"><b>Character Studio</b><span class="badge">IDENTITY • LOCKED</span></header><div class="app"><aside><button class="nav active" data-page="home">⌂ خانه</button><button class="nav" data-page="director">🎬 AI Director</button><button class="nav" data-page="manual">⚙ Manual</button><button class="nav" data-page="repair">🛠 Prompt Repair</button><button class="nav" data-page="settings">⚙ Settings</button></aside><main>
<section id="home" class="page active"><div class="panel"><h1>Character Studio</h1><p>Autonomous Creative Production Studio</p><div class="row"><button class="btn primary" onclick="go('director')">🚀 AI Director</button><button class="btn" onclick="go('manual')">⚙ Manual Workflow</button></div></div></section>
<section id="director" class="page"><div class="panel"><div class="row"><h2>🎬 Autonomous AI Director</h2><span class="badge">LIVE AI • SEEDANCE 2.5</span></div><div class="field"><label>Creative Request</label><textarea id="dIdea" class="textarea" placeholder="ایده، داستان یا Prompt را بنویس. دیالوگ را هم همین‌جا بنویس."></textarea></div><div class="field"><label>Reference Image</label><input id="ref" type="file" accept="image/*"><img id="refPreview" class="preview" style="display:none"></div><div class="panel"><b>Seedance 2.5 Element Pack</b><input id="elements" type="file" accept="image/*" multiple><div id="elementList" class="elementList"></div></div><div class="grid"><div class="field"><label>Direction / Tone</label><input id="dTone" class="input"></div><div class="field"><label>Prompt Language</label><select id="dLang" class="select"><option>English</option><option>فارسی</option><option>العربية</option><option>Türkçe</option></select></div><div class="field"><label>Dialogue Language</label><select id="dDialogueLang" class="select"><option>بدون دیالوگ</option><option>فارسی</option><option>English</option><option>آذربایجانی</option></select></div><div class="field"><label>Visual Style</label><select id="dStyle" class="select"><option>Photorealistic Cinematic</option><option>Cinematic</option><option>Documentary</option><option>Animation</option><option>3D</option></select></div></div><div class="row"><button class="btn primary" id="createAll">🚀 CREATE EVERYTHING</button><button class="btn" id="copyDirector">کپی کل خروجی</button><button class="btn success" id="copySeedance">کپی Seedance Prompt</button><button class="btn" id="exportDirector">EXPORT TXT</button></div><div id="dStatus" class="status"></div><div id="dSteps" class="step"></div><pre id="dOut" class="out" style="display:none"></pre></div></section>
<section id="manual" class="page"><div class="panel"><h2>Professional Manual Workflow</h2><p class="muted">هر Engine با کلیک روی کارت مستقیماً اجرا می‌شود؛ نیازی به کلیک دوم نیست.</p><div class="field"><label>Creative Request مشترک</label><textarea id="mIdea" class="textarea" placeholder="ایده یا Prompt را وارد کن. اگر خالی باشد از Creative Request در AI Director استفاده می‌شود."></textarea></div><div class="grid"><button class="mode" data-engine="Project Engine"><b>Project Engine</b><span>Project structure</span></button><button class="mode" data-engine="Story Engine"><b>Story Engine</b><span>Story / Arc / Character</span></button><button class="mode" data-engine="Character / Location / Prop"><b>Character / Location / Prop</b><span>Reference Mapping</span></button><button class="mode" data-engine="Style / Camera / Lighting"><b>Style / Camera / Lighting</b><span>Visual Direction</span></button><button class="mode" data-engine="Storyboard / Scene / Shot"><b>Storyboard / Scene / Shot</b><span>Shot Breakdown</span></button><button class="mode" data-engine="Image / Video Prompts"><b>Image / Video Prompts</b><span>Seedance-ready prompts</span></button><button class="mode" data-engine="Dialogue / Music / Sound"><b>Dialogue / Music / Sound</b><span>Audio direction</span></button><button class="mode" data-engine="Continuity / Generation / Export"><b>Continuity / Generation / Export</b><span>Final production</span></button></div><div id="mStatus" class="status"></div><pre id="mOut" class="out" style="display:none"></pre></div></section>
<section id="repair" class="page"><div class="panel"><h2>🛠 Prompt Repair</h2><div class="field"><label>Prompt</label><textarea id="rPrompt" class="textarea"></textarea></div><div class="field"><label>Error</label><textarea id="rError" class="textarea"></textarea></div><button class="btn primary" id="repairBtn">🔧 ANALYZE & REPAIR</button><div id="rStatus" class="status"></div><pre id="rOut" class="out" style="display:none"></pre></div></section>
<section id="settings" class="page"><div class="panel"><h2>Settings</h2><div class="field"><label>AI Backend URL</label><input id="api" class="input" placeholder="/api/generate"></div><button class="btn" id="save">ذخیره</button></div></section>
</main></div><script>
const $=s=>document.querySelector(s),els=[],roles={character:'Character',location:'Location',outfit:'Outfit',prop:'Prop',camera:'Camera / Composition',other:'Other Reference'};let lastOutput='',lastSeedance='';
function go(id){document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.page===id));document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.id===id));window.scrollTo(0,0)}document.querySelectorAll('.nav').forEach(n=>n.onclick=()=>go(n.dataset.page));
function show(el,msg,warn=false){el.textContent=msg;el.className='status'+(warn?' warn':'');el.style.display='block'}
function fileData(file){return new Promise((res,rej)=>{if(!file)return res(null);const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)})}
async function callAI(mode,payload={}){const url=(localStorage.getItem('cs_api')||'/api/generate').trim();const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode,...payload})});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.error||('Backend error '+r.status));return d.result||d}
$('#ref').onchange=e=>{const f=e.target.files[0];if(f){$('#refPreview').src=URL.createObjectURL(f);$('#refPreview').style.display='block'}};
$('#elements').onchange=e=>{[...e.target.files].forEach(f=>els.push({file:f,role:els.length===0?'character':els.length===1?'location':els.length===2?'outfit':'prop'}));e.target.value='';renderEls()};function renderEls(){$('#elementList').innerHTML='';els.forEach((x,i)=>{const d=document.createElement('div');d.className='element';const im=document.createElement('img');im.src=URL.createObjectURL(x.file);const nm=document.createElement('div');nm.className='name';nm.textContent=x.file.name;const s=document.createElement('select');s.className='select';s.innerHTML=Object.entries(roles).map(([k,v])=>`<option value="${k}" ${k===x.role?'selected':''}>${v}</option>`).join('');s.onchange=()=>x.role=s.value;const b=document.createElement('button');b.className='btn x';b.textContent='×';b.onclick=()=>{els.splice(i,1);renderEls()};d.append(im,nm,s,b);$('#elementList').append(d)})}
async function createEverything(){const idea=$('#dIdea').value.trim();if(!idea)return show($('#dStatus'),'ابتدا Creative Request را وارد کن.',true);const b=$('#createAll');b.disabled=true;show($('#dStatus'),'⏳ AI Director در حال اجراست...');try{const result=await callAI('director',{prompt:idea,tone:$('#dTone').value,promptLanguage:$('#dLang').value,dialogueLanguage:$('#dDialogueLang').value,style:$('#dStyle').value,reference:await fileData($('#ref').files[0]),elements:els.map(x=>({name:x.file.name,role:roles[x.role]}))});lastOutput=JSON.stringify(result,null,2);lastSeedance=result.seedance_prompt||'';$('#dOut').textContent=lastOutput;$('#dOut').style.display='block';$('#dSteps').innerHTML=['Project','Story','Storyboard','Element Mapping','Dialogue Extract','Seedance 2.5 Prompt','DONE'].map(x=>`<span class="done">✓ ${x}</span>`).join('');show($('#dStatus'),'✅ AI Director با موفقیت اجرا شد.')}catch(e){show($('#dStatus'),'❌ '+e.message,true)}finally{b.disabled=false}}
$('#createAll').onclick=createEverything;
$('#copyDirector').onclick=async()=>{if(lastOutput){await navigator.clipboard.writeText(lastOutput);show($('#dStatus'),'کپی شد ✓')}else show($('#dStatus'),'ابتدا CREATE EVERYTHING را اجرا کن.',true)};$('#copySeedance').onclick=async()=>{if(lastSeedance){await navigator.clipboard.writeText(lastSeedance);show($('#dStatus'),'Seedance Prompt کپی شد ✓')}else show($('#dStatus'),'ابتدا CREATE EVERYTHING را اجرا کن.',true)};$('#exportDirector').onclick=()=>{if(!lastOutput)return show($('#dStatus'),'ابتدا CREATE EVERYTHING را اجرا کن.',true);const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([lastOutput],{type:'text/plain'}));a.download='character-studio-production.txt';a.click()};
async function runManual(engine){const prompt=$('#mIdea').value.trim()||$('#dIdea').value.trim();if(!prompt)return show($('#mStatus'),'ابتدا Creative Request را وارد کن.',true);document.querySelectorAll('.mode').forEach(x=>x.classList.toggle('active',x.dataset.engine===engine));const status=$('#mStatus');show(status,'⏳ '+engine+' در حال اجرای AI واقعی است...');$('#mOut').style.display='none';try{const result=await callAI('manual',{engine,prompt,tone:$('#dTone')?.value||'',style:$('#dStyle')?.value||'Photorealistic Cinematic',promptLanguage:$('#dLang')?.value||'English',reference:await fileData($('#ref')?.files?.[0]),elements:els.map(x=>({name:x.file.name,role:roles[x.role]}))});$('#mOut').textContent=JSON.stringify(result,null,2);$('#mOut').style.display='block';show(status,'✅ '+engine+' با موفقیت اجرا شد.')}catch(e){show(status,'❌ '+engine+' اجرا نشد: '+e.message,true)}finally{document.querySelectorAll('.mode').forEach(x=>x.classList.remove('active'))}}
document.querySelectorAll('.mode').forEach(card=>card.addEventListener('click',()=>runManual(card.dataset.engine)));
$('#repairBtn').onclick=async()=>{const p=$('#rPrompt').value.trim();if(!p)return show($('#rStatus'),'Prompt را وارد کن.',true);const b=$('#repairBtn');b.disabled=true;show($('#rStatus'),'⏳ در حال تحلیل...');try{const d=await callAI('diagnostic',{prompt:`MODEL: Seedance 2.5\nERROR: ${$('#rError').value}\nPROMPT:\n${p}`});$('#rOut').textContent=JSON.stringify(d,null,2);$('#rOut').style.display='block';show($('#rStatus'),'✅ تحلیل انجام شد')}catch(e){show($('#rStatus'),'❌ '+e.message,true)}finally{b.disabled=false}};
$('#save').onclick=()=>{localStorage.setItem('cs_api',$('#api').value.trim());show($('#dStatus'),'تنظیمات ذخیره شد ✓')};$('#api').value=localStorage.getItem('cs_api')||'';
</script></body></html>
